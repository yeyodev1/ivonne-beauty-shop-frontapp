<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Ivonne Beauty Shop — Maquillaje y skincare original</title>
    <meta name="description" content="Maquillaje, skincare, perfumes y bolsos originales de USA. Tienda en Machala con envíos a todo Ecuador." />
    <meta name="theme-color" content="#e4007c" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Ivonne Beauty Shop" />
    <meta property="og:title" content="Ivonne Beauty Shop — Maquillaje y skincare original" />
    <meta property="og:description" content="Maquillaje, skincare, perfumes y bolsos originales de USA. Tienda en Machala con envíos a todo Ecuador." />
    <meta property="og:url" content="https://dev-project-front.bakano.ec" />
    <meta property="og:image" content="https://dev-project-front.bakano.ec/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Entrada suave: la página se muestra de una sola vez, con fundido, cuando
      ya están las fuentes de marca (si no, el logo salta de Georgia a
      Playfair) y la vista inicial montada (si no, se ve el header con el
      footer pegado). Tope de 2,5 s para no castigar redes lentas. El fondo
      rosado va inline para que no haya destello blanco mientras tanto.
    -->
    <style>
      html { background: #fffafc; }
      html.app-pending #app { opacity: 0; }
      #app { opacity: 1; transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: reduce) { #app { transition: none; } }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('app-pending')
        var reveal = function () { root.classList.remove('app-pending') }
        var mounted = new Promise(function (resolve) {
          window.addEventListener('app:mounted', resolve, { once: true })
        })
        var fonts = document.fonts && document.fonts.load
          ? Promise.all([
              document.fonts.load('600 1em "Playfair Display"'),
              document.fonts.load('italic 500 1em "Playfair Display"'),
              document.fonts.load('500 1em "Montserrat"'),
            ])
          : Promise.resolve()
        // Un frame extra tras montar: el navegador pinta con opacidad 0 y el
        // fundido sí se ve.
        Promise.all([fonts.catch(function () {}), mounted]).then(function () {
          requestAnimationFrame(function () { requestAnimationFrame(reveal) })
        })
        setTimeout(reveal, 2500)
      })()
    </script>

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
